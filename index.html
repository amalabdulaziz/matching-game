<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matching Game — Neon Edition</title><link rel="stylesheet" href="style.css"></head><body><main><div style="font-size:27px">✦ ✧ ✦</div><h1>MATCHING GAME</h1><p>NEON EDITION · اختبر ذاكرتك واكتشف الأزواج المتشابهة</p><section class="panel"><div class="modes" aria-label="الصعوبة"><button data-level="easy" class="active">سهل · 6 أزواج</button><button data-level="medium">متوسط · 8 أزواج</button><button data-level="hard">صعب · 12 زوج</button></div><div class="stats" style="margin-top:16px"><div class="stat"><strong id="time">00:00</strong><span>الوقت المتبقي</span></div><div class="stat"><strong id="moves">0</strong><span>المحاولات</span></div><div class="stat"><strong id="pairs">0/6</strong><span>الأزواج</span></div></div></section><div class="status" id="status" role="status">احفظ أماكن البطاقات ثم ابدأ!</div><div class="board" id="board" aria-label="بطاقات الذاكرة"></div><div class="actions"><button class="primary" id="restart">↻ لعبة جديدة</button><button id="sound" aria-pressed="true">🔊 الصوت: تشغيل</button><button id="peek">👁 نظرة سريعة (مرة واحدة)</button></div><p class="note">الوقت محدود حسب المستوى، وتبدأ الساعة مع أول بطاقة بعد الحفظ. النجاح يعتمد على عدد الحركات والوقت. التقدم محفوظ محليًا لأفضل نتيجة في كل مستوى.</p><p id="best" class="note"></p></main><script src="script.js"></script></body></html>

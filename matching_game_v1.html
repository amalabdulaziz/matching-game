<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matching Game — Neon Edition</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f5f3ff;background:#09091a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#392067 0%,transparent 42%),radial-gradient(ellipse at 90% 90%,#102e54 0%,transparent 45%),#09091a}main{max-width:750px;margin:auto;padding:28px 16px 60px;text-align:center}h1{font-size:clamp(28px,6vw,46px);letter-spacing:1px;margin:8px 0;background:linear-gradient(90deg,#cbb5ff,#7dd3fc);background-clip:text;color:transparent}p{color:#a8a6c5}.panel{background:#16152bba;border:1px solid #6e60b44d;box-shadow:0 12px 40px #0005;border-radius:20px;padding:18px;margin:20px 0}.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #7563b9;color:#f8f6ff;border-radius:12px;background:#292446;padding:10px 17px}button.active,button.primary{background:linear-gradient(135deg,#7549d4,#2466aa);border-color:#a991ff}button:focus-visible{outline:3px solid #8ed8ff;outline-offset:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#11152a;border-radius:12px;padding:12px}.stat strong{display:block;font-size:25px;color:#c4b5fd}.stat span{font-size:12px;color:#a5a3c2}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px auto;max-width:570px}.card{aspect-ratio:1;border-radius:14px;position:relative;padding:0;background:none;border:0;perspective:650px}.inner{position:absolute;inset:0;transition:transform .38s;transform-style:preserve-3d}.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;border-radius:14px;font-size:clamp(24px,5vw,45px)}.back{background:linear-gradient(145deg,#49357b,#18264f);border:1px solid #a18aff;box-shadow:inset 0 0 22px #9274ff25,0 0 12px #6d5fe43d;color:#d4c4ff}.front{transform:rotateY(180deg);background:#211e40;border:1px solid #64c9ff}.matched .front{background:#173d3e;border-color:#59e7b2;box-shadow:0 0 15px #44e5b255}.card:disabled{cursor:default}.status{min-height:32px;font-weight:650;color:#c4b5fd}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.note{font-size:12px;color:#8988a8}@media(max-width:390px){.board{gap:7px}.panel{padding:12px}.face{border-radius:10px}}
</style></head><body><main><div style="font-size:27px">✦ ✧ ✦</div><h1>MATCHING GAME</h1><p>NEON EDITION · اختبري ذاكرتك واكتشفي الأزواج المتشابهة</p><section class="panel"><div class="modes" aria-label="الصعوبة"><button data-level="easy" class="active">سهل · 6 أزواج</button><button data-level="medium">متوسط · 8 أزواج</button><button data-level="hard">صعب · 12 زوج</button></div><div class="stats" style="margin-top:16px"><div class="stat"><strong id="time">00:00</strong><span>الوقت</span></div><div class="stat"><strong id="moves">0</strong><span>المحاولات</span></div><div class="stat"><strong id="pairs">0/6</strong><span>الأزواج</span></div></div></section><div class="status" id="status" role="status">احفظي أماكن البطاقات ثم ابدئي!</div><div class="board" id="board" aria-label="بطاقات الذاكرة"></div><div class="actions"><button class="primary" id="restart">↻ لعبة جديدة</button><button id="peek">👁 نظرة سريعة (مرة واحدة)</button></div><p class="note">النجاح يعتمد على عدد الحركات والوقت. التقدم محفوظ محليًا لأفضل نتيجة في كل مستوى.</p><p id="best" class="note"></p></main><script>
(()=>{'use strict';const symbols=['🌙','💎','🦋','🌸','⚡','🪐','👑','🔮','🦄','🌟','🎮','🐉'];const counts={easy:6,medium:8,hard:12};const board=document.querySelector('#board'),status=document.querySelector('#status'),timeEl=document.querySelector('#time'),movesEl=document.querySelector('#moves'),pairsEl=document.querySelector('#pairs'),peekBtn=document.querySelector('#peek'),bestEl=document.querySelector('#best');let level='easy',deck=[],opened=[],matched=0,moves=0,seconds=0,interval=null,timeout=null,locked=true,usedPeek=false,token=0,started=false;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function bestKey(){return 'matching-neon-best-'+level}function showBest(){try{const x=JSON.parse(localStorage.getItem(bestKey()));bestEl.textContent=x?'أفضل نتيجة: '+x.moves+' محاولة خلال '+fmt(x.seconds):'لا توجد نتيجة سابقة لهذا المستوى'}catch{bestEl.textContent=''}}function clearTimers(){clearInterval(interval);clearTimeout(timeout);interval=null;timeout=null}function update(){timeEl.textContent=fmt(seconds);movesEl.textContent=moves;pairsEl.textContent=matched+'/'+counts[level]}function render(){board.innerHTML='';board.style.gridTemplateColumns='repeat(4,minmax(0,1fr))';deck.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label','بطاقة '+(i+1));b.innerHTML='<span class="inner"><span class="face back">✦</span><span class="face front"></span></span>';b.querySelector('.front').textContent=item.symbol;b.addEventListener('click',()=>flip(i));board.appendChild(b)})}function card(i){return board.children[i]}function revealAll(on){for(let i=0;i<deck.length;i++)if(!deck[i].matched)card(i).classList.toggle('flipped',on)}function startTimer(){if(started)return;started=true;interval=setInterval(()=>{seconds++;update()},1000)}function newGame(){token++;const t=token;clearTimers();opened=[];matched=0;moves=0;seconds=0;started=false;locked=true;usedPeek=false;peekBtn.disabled=false;deck=shuffle(symbols.slice(0,counts[level]).flatMap((s,id)=>[{id,symbol:s,matched:false},{id,symbol:s,matched:false}]));render();update();showBest();revealAll(true);status.textContent='احفظي البطاقات! تبدأ الجولة بعد 3 ثوانٍ';timeout=setTimeout(()=>{if(t!==token)return;revealAll(false);locked=false;status.textContent='ابدئي باختيار بطاقتين ✨'},3000)}function flip(i){if(locked||deck[i].matched||opened.includes(i))return;startTimer();card(i).classList.add('flipped');opened.push(i);if(opened.length<2)return;moves++;update();const [a,b]=opened;if(deck[a].id===deck[b].id){deck[a].matched=deck[b].matched=true;card(a).classList.add('matched');card(b).classList.add('matched');card(a).disabled=card(b).disabled=true;matched++;opened=[];status.textContent='تطابق رائع! ✨';update();if(matched===counts[level])win()}else{locked=true;status.textContent='حاولي مرة ثانية';const t=token;timeout=setTimeout(()=>{if(t!==token)return;card(a).classList.remove('flipped');card(b).classList.remove('flipped');opened=[];locked=false},850)}}function win(){clearInterval(interval);locked=true;peekBtn.disabled=true;let stars=moves<=counts[level]+2?'⭐⭐⭐':moves<=counts[level]*2?'⭐⭐':'⭐';status.textContent='🎉 فزتِ! '+stars+' — '+moves+' محاولة خلال '+fmt(seconds);try{const old=JSON.parse(localStorage.getItem(bestKey()));if(!old||moves<old.moves||(moves===old.moves&&seconds<old.seconds))localStorage.setItem(bestKey(),JSON.stringify({moves,seconds}))}catch{}showBest()}document.querySelectorAll('[data-level]').forEach(btn=>btn.addEventListener('click',()=>{level=btn.dataset.level;document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',b===btn));newGame()}));document.querySelector('#restart').addEventListener('click',newGame);peekBtn.addEventListener('click',()=>{if(locked||usedPeek||opened.length)return;usedPeek=true;peekBtn.disabled=true;locked=true;const t=token;revealAll(true);status.textContent='نظرة سريعة لمدة ثانيتين';timeout=setTimeout(()=>{if(t!==token)return;revealAll(false);locked=false;status.textContent='كملي اللعب!'},2000)});newGame()})();
</script></body></html>
